# fly.toml app configuration file generated for enes-portfolio-api on 2026-10-31T23:20:58+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'enes-portfolio-api'
primary_region = 'fra'

[build]
[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpus = 1

[env]
  DATA_DIR = '/data'

[mounts]
  source = 'data'
  destination = '/data'
